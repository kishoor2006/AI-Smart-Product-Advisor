{%extends "base.html"}{%block title%}Place Order{%endblock%}{%block content%}<section class="head"><small>DEMO ORDER</small><h1>Place Your Order</h1><p>No real payment is processed.</p></section><section class="order"><div class="card"><img src="{{url_for('static',filename='images/'+product.image)}}"><h2>{{product.name}}</h2><div class="bigprice">₹{{"{:,}".format(product.price)}}</div><p>{{product.description}}</p></div><form class="card form" method="post" action="{{url_for('place_order')}}"><input type="hidden" name="product_id" value="{{product.id}}"><h2>Customer Details</h2><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Address<textarea name="address" required></textarea></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>Pincode<input name="pincode" pattern="[0-9]{6}" required></label><label>Quantity<select name="quantity">{%for q in range(1,6)%}<option>{{q}}</option>{%endfor%}</select></label><button class="btn primary full">🛒 Place Order</button></form></section>{%endblock%}
